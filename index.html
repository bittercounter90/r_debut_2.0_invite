<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open Envelope</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Mengunci layar agar tidak bisa di-scroll sama sekali */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            touch-action: none; 
        }

        body {
            background-image: url('./assets/background.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .modal-container {
            background-color: rgba(255, 255, 255, 0.9);
            background-image: url('./assets/opacity30.png');
            background-size: cover;
            background-repeat: repeat;
            padding: 40px 20px; 
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 90%; 
            max-width: 350px; 
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .envelope-wrapper {
            background-color: #343a40;
            width: 100%;
            max-width: 250px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .btn-open {
            background-color: rgba(33, 150, 243, 0.7);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s ease;
            backdrop-filter: blur(2px);
            width: 80%; 
            max-width: 200px;
        }

        .btn-open:hover {
            background-color: rgba(33, 150, 243, 0.9);
        }

        .envelope-svg {
            width: 100%;
            max-width: 220px;
            height: auto;
            transition: transform 0.3s ease;
        }

        .envelope-wrapper:hover .envelope-svg {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="modal-container">
        <div class="envelope-wrapper">
            <svg class="envelope-svg" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
                <rect x="25" y="20" width="170" height="120" fill="#f8f9fa" rx="4" />
                <rect x="40" y="35" width="40" height="6" fill="#e74c3c" />
                <rect x="90" y="35" width="20" height="6" fill="#e74c3c" />
                <rect x="40" y="55" width="80" height="8" fill="#e74c3c" />
                <rect x="40" y="75" width="30" height="8" fill="#e74c3c" />
                <circle cx="150" cy="90" r="15" fill="#f5b7b1" opacity="0.8" />
                
                <rect x="10" y="70" width="200" height="100" fill="#87CEEB" />
                <polygon points="10,70 110,130 10,170" fill="#5DADE2" />
                <polygon points="210,70 110,130 210,170" fill="#5DADE2" />
                <polygon points="10,170 110,110 210,170" fill="#87CEEB" />
            </svg>
        </div>
        
        <button class="btn-open" onclick="openEnvelope()">OPEN</button>
    </div>
    
    <script>
        function openEnvelope() {
            // 1. Cek URL saat ini apakah ada ID yang dikirim (misal: index.html?id=2)
            const urlParams = new URLSearchParams(window.location.search);
            const guestId = urlParams.get('id');

            // 2. Jika ada ID, bawa ID tersebut ke main.html. Jika tidak ada, default ke id=1
            if (guestId) {
                window.location.href = "main.html?id=" + guestId;
            } else {
                window.location.href = "main.html?id=1"; 
            }
        }
    </script>
</body>
</html>
