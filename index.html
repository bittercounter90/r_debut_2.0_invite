<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Envelope</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Perubahan untuk GitHub: gunakan ./assets/ */
            background-image: url('./assets/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .modal-container {
            /* Perubahan untuk GitHub: gunakan ./assets/ */
            background-color: rgba(255, 255, 255, 0.9);
            background-image: url('./assets/opacity30.png');
            background-size: cover;
            background-repeat: repeat;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .envelope-wrapper {
            background-color: #343a40;
            width: 250px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .btn-open {
            background-color: rgba(33, 150, 243, 0.7);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s ease;
            backdrop-filter: blur(2px);
        }

        .btn-open:hover {
            background-color: rgba(33, 150, 243, 0.9);
        }

        .envelope-svg {
            width: 220px;
            height: 180px;
            transition: transform 0.3s ease;
        }

        .envelope-wrapper:hover .envelope-svg {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="modal-container">
        <div class="envelope-wrapper">
            <svg class="envelope-svg" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
                <rect x="25" y="20" width="170" height="120" fill="#f8f9fa" rx="4" />
                <rect x="40" y="35" width="40" height="6" fill="#e74c3c" />
                <rect x="90" y="35" width="20" height="6" fill="#e74c3c" />
                <rect x="40" y="55" width="80" height="8" fill="#e74c3c" />
                <rect x="40" y="75" width="30" height="8" fill="#e74c3c" />
                <circle cx="150" cy="90" r="15" fill="#f5b7b1" opacity="0.8" />
                
                <rect x="10" y="70" width="200" height="100" fill="#87CEEB" />
                <polygon points="10,70 110,130 10,170" fill="#5DADE2" />
                <polygon points="210,70 110,130 210,170" fill="#5DADE2" />
                <polygon points="10,170 110,110 210,170" fill="#87CEEB" />
            </svg>
        </div>
        
        <button class="btn-open" onclick="openEnvelope()">OPEN</button>
    </div>

    <!-- Gunakan ./ untuk memastikan file JS terbaca di repo yang sama -->
    <script src="./database.js"></script>
    
    <script>
        function openEnvelope() {
            console.log("Mencoba membuka surat...");
        }
    </script>
</body>
</html>
