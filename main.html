<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debut Invitation</title>
    <style>
        /* === RESET & BASE STYLES === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            /* Background menyesuaikan aset kamu */
            background-image: url('./assets/background.png');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        /* === MAIN CARD CONTAINER === */
        .invitation-card {
            background-color: white;
            background-image: url('./assets/opacity30.png');
            background-size: cover;
            width: 90%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* === TYPOGRAPHY === */
        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .event-phase {
            font-size: 18px;
            font-weight: bold;
            margin: 5px 0 20px 0;
        }

        /* === IMAGE PLACEHOLDER === */
        .image-placeholder {
            width: 150px;
            height: 150px;
            padding: 10px; /* Padding untuk insert image nanti */
            border: 4px solid #000;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }

        /* === GUEST NAME BOX === */
        .guest-box {
            width: 80%;
            padding: 15px;
            border: 2px dashed #3498db;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            min-height: 55px; /* Menjaga tinggi agar tidak collapse kalau kosong */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === COUNTDOWN STYLES === */
        .countdown-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .countdown-value {
            font-size: 24px;
            font-weight: bold;
        }

        .countdown-label {
            font-size: 12px;
            color: #555;
        }

        /* === BUTTONS === */
        .button-group {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            width: 120px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #1e88e5;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: #1565c0;
        }

        .btn-outline {
            background-color: transparent;
            color: #1e88e5;
            border: 1px solid #1e88e5;
        }

        .btn-outline:hover {
            background-color: #f1f8ff;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="title">DEBUT INVITATION</div>
        <div class="subtitle">Rucus Live ID</div>

        <!-- Area Gambar (Tinggal ganti tag SVG di bawah dengan tag <img> nanti) -->
        <div class="image-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" width="80" height="80">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
        </div>

        <!-- Kotak Nama Tamu -->
        <div class="guest-box" id="guestNameDisplay">
            Loading...
        </div>

        <div>You have been invited to</div>
        <div class="event-phase">Meowtiverse Phase 2</div>

        <!-- Countdown Timer -->
        <div class="countdown-container">
            <div class="countdown-item">
                <div class="countdown-value" id="days">00</div>
                <div class="countdown-label">days</div>
            </div>
            <div class="countdown-value">:</div>
            <div class="countdown-item">
                <div class="countdown-value" id="hours">00</div>
                <div class="countdown-label">hours</div>
            </div>
            <div class="countdown-value">:</div>
            <div class="countdown-item">
                <div class="countdown-value" id="minutes">00</div>
                <div class="countdown-label">minutes</div>
            </div>
            <div class="countdown-value">:</div>
            <div class="countdown-item">
                <div class="countdown-value" id="seconds">00</div>
                <div class="countdown-label">seconds</div>
            </div>
        </div>

        <!-- Tombol Aksi -->
        <div class="button-group">
            <button class="btn btn-primary">NEXT</button>
            <button class="btn btn-outline">NEXT</button>
        </div>
    </div>

    <!-- Panggil file database -->
    <script src="./database.js"></script>

    <!-- Logika Aplikasi (Controller) -->
    <script>
        // --- 1. LOGIKA UNTUK MENAMPILKAN NAMA TAMU ---
        function loadGuestName() {
            // Mengambil parameter 'id' dari URL (contoh: main.html?id=1)
            const urlParams = new URLSearchParams(window.location.search);
            const guestId = urlParams.get('id');
            const displayElement = document.getElementById('guestNameDisplay');

            // Cek apakah ID ada di URL dan data ada di database.js
            if (guestId && guestDatabase[guestId]) {
                displayElement.textContent = guestDatabase[guestId];
            } else {
                displayElement.textContent = "Tamu Spesial"; // Fallback jika ID tidak valid
            }
        }

        // --- 2. LOGIKA UNTUK COUNTDOWN TIMER ---
        // INI BUAT NGATUR COUNTDOWN (Ke tanggal 1 bulan depan)
        function initCountdown() {
            const now = new Date();
            
            // Set target: Tahun ini, Bulan Depan (+1), Tanggal 1, Jam 00:00:00
            // Catatan: getMonth() dimulai dari 0 (Januari = 0)
            const targetDate = new Date(now.getFullYear(), now.getMonth() + 1, 1, 0, 0, 0);

            function updateTimer() {
                const currentTime = new Date();
                const difference = targetDate - currentTime;

                if (difference <= 0) {
                    // Jika waktu sudah habis
                    document.getElementById('days').textContent = "00";
                    document.getElementById('hours').textContent = "00";
                    document.getElementById('minutes').textContent = "00";
                    document.getElementById('seconds').textContent = "00";
                    return;
                }

                // Kalkulasi hari, jam, menit, detik
                const d = Math.floor(difference / (1000 * 60 * 60 * 24));
                const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((difference % (1000 * 60)) / 1000);

                // Format ke 2 digit (contoh: 5 jadi "05")
                document.getElementById('days').textContent = d.toString().padStart(2, '0');
                document.getElementById('hours').textContent = h.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = m.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = s.toString().padStart(2, '0');
            }

            // Jalankan updateTimer setiap 1 detik
            setInterval(updateTimer, 1000);
            updateTimer(); // Jalankan sekali di awal agar tidak delay
        }

        // --- 3. JALANKAN SEMUA FUNGSI SAAT HALAMAN DIBUKA ---
        window.onload = function() {
            loadGuestName();
            initCountdown();
        };
    </script>
</body>
</html>
