<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debut Invitation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-image: url('./assets/background.png');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .invitation-card {
            background-color: white;
            background-image: url('./assets/opacity30.png');
            background-size: cover;
            width: 90%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .event-phase {
            font-size: 18px;
            font-weight: bold;
            margin: 5px 0 20px 0;
        }

        .image-placeholder {
            width: 150px;
            height: 150px;
            padding: 10px; 
            border: 4px solid #000;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }

        .guest-box {
            width: 80%;
            padding: 15px;
            border: 2px dashed #3498db;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            min-height: 55px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .countdown-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .countdown-value {
            font-size: 24px;
            font-weight: bold;
        }

        .countdown-label {
            font-size: 12px;
            color: #555;
        }

        .btn-next {
            background-color: #1e88e5; 
            color: white;             
            border: 2px solid #1e88e5;
            padding: 12px 0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            max-width: 200px;
            transition: all 0.3s ease; 
        }

        .btn-next:hover, 
        .btn-next:active {
            background-color: white;   
            color: #1e88e5;           
        }

        @media (min-width: 768px) {
            .invitation-card {
                max-width: 550px;
                padding: 40px 30px;
            }
            .title {
                font-size: 32px;
            }
            .subtitle {
                font-size: 20px;
                margin-bottom: 25px;
            }
            .image-placeholder {
                width: 200px;
                height: 200px;
            }
            .guest-box {
                font-size: 24px;
                padding: 20px;
            }
            .event-phase {
                font-size: 24px;
            }
            .countdown-value {
                font-size: 36px;
            }
            .countdown-label {
                font-size: 14px;
            }
            .btn-next {
                max-width: 250px;
                padding: 15px 0;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="title">DEBUT INVITATION</div>
        <div class="subtitle">Rucus Live ID</div>

        <div class="image-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" width="100%" height="100%">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
        </div>

        <div class="guest-box" id="guestNameDisplay">
            Loading...
        </div>

        <div>You have been invited to</div>
        <div class="event-phase">Meowtiverse Phase 2</div>

        <div class="countdown-container">
            <div class="countdown-item">
                <div class="countdown-value" id="days">00</div>
                <div class="countdown-label">days</div>
            </div>
            <div class="countdown-value">:</div>
            <div class="countdown-item">
                <div class="countdown-value" id="hours">00</div>
                <div class="countdown-label">hours</div>
            </div>
            <div class="countdown-value">:</div>
            <div class="countdown-item">
                <div class="countdown-value" id="minutes">00</div>
                <div class="countdown-label">minutes</div>
            </div>
            <div class="countdown-value">:</div>
            <div class="countdown-item">
                <div class="countdown-value" id="seconds">00</div>
                <div class="countdown-label">seconds</div>
            </div>
        </div>

        <button class="btn-next" onclick="handleNext()">NEXT</button>
    </div>

    <script src="./database.js"></script>

    <script>
        function loadGuestName() {
            const urlParams = new URLSearchParams(window.location.search);
            const guestId = urlParams.get('id');
            const displayElement = document.getElementById('guestNameDisplay');

            if (guestId && guestDatabase[guestId]) {
                displayElement.textContent = guestDatabase[guestId];
                displayElement.style.color = "#333";
                displayElement.style.borderColor = "#3498db";
            } else {
                displayElement.textContent = "Not Invited / Tidak Terdaftar"; 
                displayElement.style.color = "#e74c3c"; 
                displayElement.style.borderColor = "#e74c3c"; 
            }
        }

        function initCountdown() {
            const now = new Date();
            const targetDate = new Date(now.getFullYear(), now.getMonth() + 1, 1, 0, 0, 0);

            function updateTimer() {
                const currentTime = new Date();
                const difference = targetDate - currentTime;

                if (difference <= 0) {
                    document.getElementById('days').textContent = "00";
                    document.getElementById('hours').textContent = "00";
                    document.getElementById('minutes').textContent = "00";
                    document.getElementById('seconds').textContent = "00";
                    return;
                }

                const d = Math.floor(difference / (1000 * 60 * 60 * 24));
                const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = d.toString().padStart(2, '0');
                document.getElementById('hours').textContent = h.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = m.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = s.toString().padStart(2, '0');
            }

            setInterval(updateTimer, 1000);
            updateTimer(); 
        }

        function handleNext() {
            const urlParams = new URLSearchParams(window.location.search);
            const guestId = urlParams.get('id');

            if (guestId) {
                window.location.href = "end.html?id=" + guestId;
            } else {
                window.location.href = "end.html";
            }
        }

        window.onload = function() {
            loadGuestName();
            initCountdown();
        };
    </script>
</body>
</html>
